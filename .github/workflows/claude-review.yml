# ================================================================
# Claude Code Review
#
# Runs an automated Claude review on pull requests from develop
# into sit: when the PR is opened/reopened/marked ready, and on
# every push to develop while that PR is open.
#
# REQUIRED SECRET:
# CLAUDE_CODE_OAUTH_TOKEN  (Claude Pro/Max subscription;
#                           generate with `claude setup-token`)
# ================================================================

name: Claude Code Review

on:
  pull_request:
    branches: [sit]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only develop -> sit PRs from this repo, and skip drafts
    if: >
      github.head_ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this Salesforce pull request. Focus on:
            - Correctness bugs and logic errors in Apex, triggers, LWC and Flows
            - Governor limits: SOQL/DML inside loops, missing bulkification
            - Security: missing sharing keywords, CRUD/FLS checks, SOQL injection
            - Test classes: real assertions, bulk and negative cases, no SeeAllData=true
            - Hardcoded IDs, URLs or credentials
            - Destructive or risky metadata changes

            Use `gh pr diff` to see the changes. Post specific issues as inline
            comments on the relevant lines, then leave one short summary comment
            on the PR with `gh pr comment`. Only flag real problems; skip style nits.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
