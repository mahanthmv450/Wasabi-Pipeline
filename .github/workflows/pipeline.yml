# ================================================================
# Salesforce Delta Deployment Pipeline
#
# FLOW:
# 1. Developer creates PR  → Validation runs automatically
# 2. Validation passes     → Reviewer approves PR manually
# 3. PR merged             → Actual deployment runs
#                            (gated by the GitHub Environment of the
#                             same name: add required reviewers to
#                             UAT / PROD in Settings → Environments)
#
# BRANCH → ORG MAPPING:
# develop → DEV Sandbox    (deploy: NoTestRun, validate: RunLocalTests)
# sit     → SIT Sandbox    (RunLocalTests)
# uat     → UAT Sandbox    (RunLocalTests)
# master  → PRODUCTION     (RunLocalTests)
#
# REQUIRED SECRETS:
# SALESFORCE_AUTH_URL_DEV / _SIT / _UAT / _PROD
# CLAUDE_CODE_OAUTH_TOKEN  (optional: AI fix suggestions on failure)
#
# REPORTING:
# Every run posts a results comment (components changed, status,
# failure reason, Claude fix suggestions on failure):
#   PR   → one comment on the PR, updated on each new push
#   push → a comment on the deployed commit
# Report logic lives in scripts/ci/pipeline_report.py
# ================================================================

name: Salesforce Delta Pipeline

on:
  push:
    branches: [develop, sit, uat, master]
    paths:
      - 'force-app/**'
      - 'scripts/ci/**'
      - '.github/workflows/pipeline.yml'
  pull_request:
    branches: [develop, sit, uat, master]
    paths:
      - 'force-app/**'
      - 'scripts/ci/**'
      - '.github/workflows/pipeline.yml'

permissions:
  contents: read

env:
  SF_CLI_VERSION: 2.157.8
  SGD_VERSION: 6.45.1

jobs:
  # --------------------------------------------------------------
  # Resolve target org from the branch (push) or base branch (PR)
  # --------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.map.outputs.env_name }}
      test_level: ${{ steps.map.outputs.test_level }}
      validate_test_level: ${{ steps.map.outputs.validate_test_level }}
    steps:
      - name: Map branch to org
        id: map
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          case "$TARGET_BRANCH" in
            develop) ENV_NAME=DEV;  TEST_LEVEL=NoTestRun;     VALIDATE_TEST_LEVEL=RunLocalTests ;;
            sit)     ENV_NAME=SIT;  TEST_LEVEL=RunLocalTests; VALIDATE_TEST_LEVEL=RunLocalTests ;;
            uat)     ENV_NAME=UAT;  TEST_LEVEL=RunLocalTests; VALIDATE_TEST_LEVEL=RunLocalTests ;;
            master)  ENV_NAME=PROD; TEST_LEVEL=RunLocalTests; VALIDATE_TEST_LEVEL=RunLocalTests ;;
            *) echo "::error::No org mapped for branch '$TARGET_BRANCH'"; exit 1 ;;
          esac
          echo "env_name=$ENV_NAME"                       >> "$GITHUB_OUTPUT"
          echo "test_level=$TEST_LEVEL"                   >> "$GITHUB_OUTPUT"
          echo "validate_test_level=$VALIDATE_TEST_LEVEL" >> "$GITHUB_OUTPUT"
          echo "Target: $TARGET_BRANCH → $ENV_NAME"

  # --------------------------------------------------------------
  # Validate (PR) or deploy (push) the delta
  # --------------------------------------------------------------
  deploy:
    needs: setup
    runs-on: ubuntu-latest
    name: ${{ github.event_name == 'pull_request' && 'Validate' || 'Deploy' }} → ${{ needs.setup.outputs.env_name }}

    # Approval gate only applies to real deployments, not PR validation
    environment: ${{ github.event_name == 'push' && needs.setup.outputs.env_name || '' }}

    # One deployment per org at a time, in order; never cancel a running deploy
    concurrency:
      group: sf-${{ needs.setup.outputs.env_name }}-${{ github.event_name }}
      cancel-in-progress: false

    # contents: write is needed to comment on commits (push runs)
    permissions:
      contents: write
      pull-requests: write

    env:
      ENV_NAME: ${{ needs.setup.outputs.env_name }}
      TEST_LEVEL: ${{ needs.setup.outputs.test_level }}
      VALIDATE_TEST_LEVEL: ${{ needs.setup.outputs.validate_test_level }}
      OPERATION: ${{ github.event_name == 'pull_request' && 'Validate' || 'Deploy' }}
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

    steps:
      - name: Checkout Full Git History
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        id: install_cli
        run: |
          npm install --global "@salesforce/cli@${SF_CLI_VERSION}"
          sf --version

      - name: Install sfdx-git-delta
        id: install_sgd
        run: |
          mkdir -p ~/.config/sf
          echo '["sfdx-git-delta"]' > ~/.config/sf/unsignedPluginAllowList.json
          sf plugins install "sfdx-git-delta@${SGD_VERSION}"
          sf plugins

      - name: Authenticate to Salesforce (${{ env.ENV_NAME }})
        id: auth
        env:
          AUTH_URL: ${{ secrets[format('SALESFORCE_AUTH_URL_{0}', needs.setup.outputs.env_name)] }}
        run: |
          if [ -z "$AUTH_URL" ]; then
            echo "::error::Secret SALESFORCE_AUTH_URL_${ENV_NAME} is missing or empty"
            exit 1
          fi
          echo "$AUTH_URL" | sf org login sfdx-url \
            --alias target-org \
            --sfdx-url-stdin

      - name: Determine Delta Range
        id: delta_range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" == "pull_request" ]; then
            FROM_SHA="$PR_BASE_SHA"
          else
            FROM_SHA="$PUSH_BEFORE_SHA"
          fi

          # New branch (all-zero SHA) or force-push (old SHA no longer in history)
          if [ -z "$FROM_SHA" ] || [ "$FROM_SHA" == "0000000000000000000000000000000000000000" ] || \
             ! git cat-file -e "${FROM_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::Could not resolve previous commit ($FROM_SHA); falling back to HEAD~1"
            FROM_SHA=$(git rev-parse HEAD~1)
          fi

          echo "FROM_SHA=$FROM_SHA" >> "$GITHUB_ENV"
          echo "Delta range: $FROM_SHA → $(git rev-parse HEAD)"

      - name: Generate Delta Package
        id: delta
        run: |
          mkdir -p delta
          sf sgd source delta \
            --from "$FROM_SHA" \
            --to HEAD \
            --output-dir delta \
            --source-dir force-app \
            --generate-delta

          echo "====== Delta Components for $ENV_NAME ======"
          cat delta/package/package.xml
          echo "====== Destructive Changes for $ENV_NAME ======"
          cat delta/destructiveChanges/destructiveChanges.xml

          HAS_CHANGES=false
          HAS_DESTRUCTIVE=false
          grep -q '<members>' delta/package/package.xml && HAS_CHANGES=true
          if [ -f delta/destructiveChanges/destructiveChanges.xml ] && \
             grep -q '<members>' delta/destructiveChanges/destructiveChanges.xml; then
            HAS_DESTRUCTIVE=true
          fi
          echo "HAS_CHANGES=$HAS_CHANGES"         >> "$GITHUB_ENV"
          echo "HAS_DESTRUCTIVE=$HAS_DESTRUCTIVE" >> "$GITHUB_ENV"

      - name: Build Deploy Arguments
        id: build_args
        run: |
          ARGS="--manifest delta/package/package.xml --target-org target-org --wait 120"
          if [ "$HAS_DESTRUCTIVE" == "true" ]; then
            ARGS="$ARGS --post-destructive-changes delta/destructiveChanges/destructiveChanges.xml"
          fi
          echo "DEPLOY_ARGS=$ARGS" >> "$GITHUB_ENV"

      # Validate on PR, deploy on push. Output is captured as JSON for the
      # report; the job is failed at the end so reporting still runs.
      - name: ${{ env.OPERATION }} Delta (${{ env.ENV_NAME }})
        id: sfdeploy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p pipeline-report
          if [ "$EVENT_NAME" == "pull_request" ]; then
            CMD=validate; LEVEL="$VALIDATE_TEST_LEVEL"
          else
            CMD=start;    LEVEL="$TEST_LEVEL"
          fi
          echo "TEST_LEVEL_USED=$LEVEL" >> "$GITHUB_ENV"

          if [ "$HAS_CHANGES" != "true" ] && [ "$HAS_DESTRUCTIVE" != "true" ]; then
            echo "No Salesforce metadata changes found. Skipping."
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Running: sf project deploy $CMD (test level $LEVEL)…"
          set +e
          sf project deploy $CMD $DEPLOY_ARGS --test-level "$LEVEL" --json \
            > pipeline-report/deploy-result.json
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "sf exited with $EXIT_CODE"

      # ------------------------------------------------------------
      # Reporting (runs on success and failure)
      # ------------------------------------------------------------
      - name: Analyze Result
        if: always() && steps.checkout.outcome == 'success'
        env: &report_env
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_EXIT_CODE: ${{ steps.sfdeploy.outputs.exit_code }}
          OUTCOME_CHECKOUT: ${{ steps.checkout.outcome }}
          OUTCOME_INSTALL_CLI: ${{ steps.install_cli.outcome }}
          OUTCOME_INSTALL_SGD: ${{ steps.install_sgd.outcome }}
          OUTCOME_AUTH: ${{ steps.auth.outcome }}
          OUTCOME_DELTA_RANGE: ${{ steps.delta_range.outcome }}
          OUTCOME_DELTA: ${{ steps.delta.outcome }}
          OUTCOME_BUILD_ARGS: ${{ steps.build_args.outcome }}
          OUTCOME_SFDEPLOY: ${{ steps.sfdeploy.outcome }}
        run: python3 scripts/ci/pipeline_report.py analyze

      # Only for real Salesforce failures (component / test / coverage errors)
      - name: Claude Fix Suggestions
        if: >
          always() &&
          steps.sfdeploy.outputs.exit_code != '' &&
          steps.sfdeploy.outputs.exit_code != '0' &&
          env.HAS_CLAUDE_TOKEN == 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            A Salesforce ${{ env.OPERATION }} to the ${{ env.ENV_NAME }} org failed.

            1. Read pipeline-report/failure.md for the errors Salesforce returned.
            2. Read the affected source under force-app/ (Apex classes, triggers,
               test classes, LWC, flows, objects/fields) to find the root cause.
               delta/package/package.xml lists every component in this change.
            3. Write your answer to pipeline-report/claude-suggestions.md.
               Do not create or modify any other file.

            Format of claude-suggestions.md (GitHub Markdown, no top-level heading):
            - One "#### <component or test name>" section per distinct root cause.
            - **Cause:** one or two sentences, citing file path and line.
            - **Fix:** concrete steps, with a short code snippet when it helps.
            - For coverage failures, name the classes below 75% and the test
              methods to add.
            - For a missing dependency (field, object, class not in the org),
              say which component must be added to the commit or deployed first.
            Be concise and specific. No preamble, no closing summary.
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Write"

      - name: Build Comment
        if: always() && steps.checkout.outcome == 'success'
        env: *report_env
        run: |
          python3 scripts/ci/pipeline_report.py comment
          cat pipeline-report/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post Comment
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          [ -s pipeline-report/comment.md ] || { echo "No comment to post"; exit 0; }

          if [ "$EVENT_NAME" == "pull_request" ]; then
            # Update the existing report comment on this PR instead of adding a new one
            EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
              --jq '.[] | select(.body | startswith("<!-- sf-pipeline-report -->")) | .id' | tail -n 1)
            if [ -n "$EXISTING" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -F body=@pipeline-report/comment.md > /dev/null
              echo "Updated PR comment $EXISTING"
            else
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file pipeline-report/comment.md
            fi
          else
            gh api "repos/$REPO/commits/$SHA/comments" -F body=@pipeline-report/comment.md > /dev/null
            echo "Commented on commit $SHA"
          fi

      - name: Fail Job If ${{ env.OPERATION }} Failed
        if: always() && steps.sfdeploy.outputs.exit_code != '' && steps.sfdeploy.outputs.exit_code != '0'
        run: |
          echo "::error::Salesforce ${OPERATION,,} failed on $ENV_NAME. See the report above."
          exit 1
